<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="1600" height="1000" role="img" aria-label="質問をナレッジに照らし、記述があれば答え、無ければ答えないという分岐を表した図">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B6FE0"/>
      <stop offset="100%" stop-color="#0EA5C4"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="#F7F8FB"/>

  <!-- 質問 -->
  <rect x="34" y="188" width="152" height="128" rx="20" fill="#FFFFFF" stroke="#DDE2E8" stroke-width="4"/>
  <text x="110" y="298" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="86" font-weight="800" fill="#0F1222">?</text>

  <path d="M200 252 H240" stroke="url(#g)" stroke-width="11" stroke-linecap="round"/>
  <path d="M238 234 L266 252 L238 270 z" fill="#0EA5C4"/>

  <!-- ナレッジ -->
  <rect x="286" y="170" width="190" height="164" rx="20" fill="#EEF3FB" stroke="#C6D6F2" stroke-width="5"/>
  <g fill="#3B6FE0">
    <rect x="322" y="212" width="118" height="14" rx="7"/>
    <rect x="322" y="245" width="118" height="14" rx="7" opacity=".6"/>
    <rect x="322" y="278" width="74" height="14" rx="7" opacity=".35"/>
  </g>
  <text x="381" y="382" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" fill="#2E4E86">ナレッジ</text>

  <!-- ナレッジに記述があるかで2つに分かれる -->
  <g stroke="#0EA5C4" stroke-width="9" fill="none" stroke-linecap="round">
    <path d="M490 252 H512"/>
    <path d="M512 252 V131"/>
    <path d="M512 252 V373"/>
    <path d="M512 131 H528"/>
    <path d="M512 373 H528"/>
  </g>
  <path d="M526 115 L552 131 L526 147 z" fill="#0EA5C4"/>
  <path d="M526 357 L552 373 L526 389 z" fill="#0EA5C4"/>

  <!-- 記述があれば答える -->
  <rect x="544" y="72" width="228" height="118" rx="20" fill="#E9F6F0" stroke="#A9DCC6" stroke-width="5"/>
  <path d="M576 130 L594 148 L624 112" stroke="#1F6B4A" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="700" y="145" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" fill="#1F6B4A">答える</text>

  <!-- 無ければ答えない -->
  <rect x="544" y="314" width="228" height="118" rx="20" fill="#FFF4F2" stroke="#E8B49B" stroke-width="5"/>
  <path d="M576 352 L612 388 M612 352 L576 388" stroke="#B44E19" stroke-width="13" stroke-linecap="round"/>
  <text x="708" y="387" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" fill="#B44E19">答えない</text>
</svg>
