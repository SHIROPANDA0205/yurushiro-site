<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="利用中のSaaS人事システムを解析し、OutSystemsのWebアプリとして内製化した流れと、東京側リーダーとして自社と外部パートナーをとりまとめた体制を表した図">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B6FE0"/>
      <stop offset="100%" stop-color="#0EA5C4"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F7F8FB"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#0F1222" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0EA5C4"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="url(#paper)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>

  <text x="80" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="800" fill="#0F1222">既存のSaaSを解析し、ローコードで作り直す</text>
  <rect x="80" y="128" width="120" height="5" rx="2.5" fill="url(#g1)"/>

  <!-- ============ 上段：内製化の流れ ============ -->
  <text x="80" y="200" font-family="ui-monospace, monospace" font-size="24" font-weight="600" fill="#0EA5C4" letter-spacing="4">REBUILD</text>

  <g>
    <!-- 既存のSaaS -->
    <rect x="80" y="232" width="380" height="200" rx="18" fill="#FFFFFF" stroke="#DDE2E8" stroke-width="2"/>
    <text x="112" y="290" font-family="system-ui, sans-serif" font-size="24" fill="#8A90A6">利用中だった</text>
    <text x="112" y="340" font-family="system-ui, sans-serif" font-size="34" font-weight="700" fill="#0F1222">SaaSの人事システム</text>
    <g fill="#D8DEE7">
      <rect x="112" y="368" width="180" height="12" rx="6"/>
      <rect x="112" y="394" width="240" height="12" rx="6"/>
    </g>

    <!-- 解析 -->
    <path d="M486 332 H556" stroke="url(#g1)" stroke-width="7" stroke-linecap="round" marker-end="url(#ar)"/>
    <rect x="588" y="252" width="240" height="160" rx="18" fill="#EEF3FB" stroke="#C6D6F2" stroke-width="3"/>
    <circle cx="686" cy="316" r="26" fill="none" stroke="#3B6FE0" stroke-width="6"/>
    <path d="M706 336 L730 360" stroke="#3B6FE0" stroke-width="8" stroke-linecap="round"/>
    <text x="708" y="392" text-anchor="middle" font-family="system-ui, sans-serif" font-size="30" font-weight="700" fill="#2E4E86">仕様を解析</text>
    <path d="M854 332 H924" stroke="url(#g1)" stroke-width="7" stroke-linecap="round" marker-end="url(#ar)"/>

    <!-- 内製したWebアプリ -->
    <rect x="956" y="232" width="564" height="200" rx="18" fill="#FFFFFF" stroke="#DDE2E8" stroke-width="2"/>
    <rect x="956" y="232" width="564" height="62" rx="18" fill="url(#g1)"/>
    <rect x="956" y="276" width="564" height="18" fill="url(#g1)"/>
    <text x="988" y="275" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">OutSystems でゼロから実装</text>

    <!-- 部品を組み合わせる表現 -->
    <g>
      <rect x="988" y="322" width="150" height="80" rx="10" fill="#F4F7FC" stroke="#DDE2E8" stroke-width="2"/>
      <rect x="1154" y="322" width="150" height="80" rx="10" fill="#F4F7FC" stroke="#DDE2E8" stroke-width="2"/>
      <rect x="1320" y="322" width="168" height="80" rx="10" fill="#F4F7FC" stroke="#DDE2E8" stroke-width="2"/>
      <text x="1063" y="370" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" fill="#0F1222">画面</text>
      <text x="1229" y="370" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" fill="#0F1222">ロジック</text>
      <text x="1404" y="370" text-anchor="middle" font-family="ui-monospace, monospace" font-size="22" fill="#0F1222">Forge / JS</text>
    </g>
  </g>

  <!-- ============ 下段：体制 ============ -->
  <text x="80" y="512" font-family="ui-monospace, monospace" font-size="24" font-weight="600" fill="#0EA5C4" letter-spacing="4">TEAM</text>

  <g>
    <!-- 自分（東京側リーダー） -->
    <rect x="600" y="540" width="400" height="86" rx="14" fill="url(#g1)"/>
    <text x="800" y="594" text-anchor="middle" font-family="system-ui, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">東京側リーダー（自分）</text>

    <!-- つなぐ線 -->
    <path d="M800 626 V664" stroke="#C6D6F2" stroke-width="4"/>
    <path d="M380 664 H1220" stroke="#C6D6F2" stroke-width="4"/>
    <path d="M380 664 V700" stroke="#C6D6F2" stroke-width="4"/>
    <path d="M800 664 V700" stroke="#C6D6F2" stroke-width="4"/>
    <path d="M1220 664 V700" stroke="#C6D6F2" stroke-width="4"/>

    <rect x="220" y="700" width="320" height="80" rx="12" fill="#FFFFFF" stroke="#DDE2E8" stroke-width="2"/>
    <text x="380" y="748" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" fill="#0F1222">自社メンバー</text>

    <rect x="640" y="700" width="320" height="80" rx="12" fill="#FFFFFF" stroke="#DDE2E8" stroke-width="2"/>
    <text x="800" y="748" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" fill="#0F1222">外部パートナー</text>

    <rect x="1060" y="700" width="320" height="80" rx="12" fill="#F4F7FC" stroke="#DDE2E8" stroke-width="2"/>
    <text x="1220" y="738" text-anchor="middle" font-family="ui-monospace, monospace" font-size="24" fill="#5A6178">Backlog</text>
    <text x="1220" y="766" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#8A90A6">で進捗を管理</text>

    <!-- ナレッジ共有 -->
    <rect x="1130" y="540" width="390" height="86" rx="14" fill="#E9F6F0" stroke="#A9DCC6" stroke-width="2"/>
    <text x="1160" y="580" font-family="system-ui, sans-serif" font-size="24" fill="#1F6B4A">ナレッジ共有会を開催し</text>
    <text x="1160" y="610" font-family="system-ui, sans-serif" font-size="24" fill="#1F6B4A">自社に知見を残した</text>
  </g>

  <!-- 下段 -->
  <line x1="80" y1="822" x2="1520" y2="822" stroke="#0F1222" stroke-opacity="0.09" stroke-width="2"/>
  <g font-family="system-ui, sans-serif">
    <text x="80" y="884" font-family="ui-monospace, monospace" font-size="24" fill="#8A90A6">期間</text>
    <text x="80" y="930" font-size="30" font-weight="700" fill="#0F1222">2025.01 – 2025.07</text>

    <text x="480" y="884" font-family="ui-monospace, monospace" font-size="24" fill="#8A90A6">規模</text>
    <text x="480" y="930" font-size="30" font-weight="700" fill="#0F1222">チーム15名</text>

    <text x="880" y="884" font-family="ui-monospace, monospace" font-size="24" fill="#8A90A6">立場</text>
    <text x="880" y="930" font-size="30" font-weight="700" fill="#0F1222">東京側リーダー</text>

    <text x="1240" y="884" font-family="ui-monospace, monospace" font-size="24" fill="#8A90A6">技術</text>
    <text x="1240" y="930" font-size="30" font-weight="700" fill="#0F1222">OutSystems / JS</text>
  </g>
</svg>
