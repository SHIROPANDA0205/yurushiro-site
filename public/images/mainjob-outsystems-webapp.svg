<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="既存のSaaS人事システムを、OutSystemsによるWebアプリとして内製化したことを表した図">
  <defs>
    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B6FE0"/>
      <stop offset="55%" stop-color="#8B4FE0"/>
      <stop offset="100%" stop-color="#0EA5C4"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B6FE0"/>
      <stop offset="100%" stop-color="#0EA5C4"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7F8FB"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#0F1222" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B6FE0" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#3B6FE0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#fade)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="800" cy="430" rx="520" ry="320" fill="url(#glow)"/>

  <!-- 左：既存のSaaS人事 -->
  <g>
    <rect x="90" y="230" width="380" height="380" rx="28" fill="#0F1222"/>
    <ellipse cx="280" cy="340" rx="110" ry="48" fill="#3B6FE0"/>
    <rect x="170" y="340" width="220" height="90" fill="#3B6FE0"/>
    <ellipse cx="280" cy="430" rx="110" ry="48" fill="#2A58C4"/>
    <text x="280" y="520" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#FFFFFF">SaaS人事</text>
    <text x="280" y="564" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" fill="#8A90A6">利用中の既存システム</text>
  </g>

  <!-- 中央：OutSystems -->
  <g>
    <rect x="530" y="230" width="540" height="380" rx="28" fill="#FFFFFF" stroke="#0F1222" stroke-opacity="0.10" stroke-width="2"/>
    <text x="800" y="292" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#5A6178">ローコード内製化</text>

    <rect x="570" y="326" width="460" height="120" rx="22" fill="url(#brand)"/>
    <text x="800" y="400" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="42" font-weight="800" fill="#FFFFFF">OutSystems</text>

    <rect x="570" y="470" width="214" height="88" rx="22" fill="#0F1222"/>
    <text x="677" y="524" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">Forge / JS</text>

    <rect x="808" y="470" width="222" height="88" rx="22" fill="#F7F8FB" stroke="#0F1222" stroke-opacity="0.08" stroke-width="2"/>
    <text x="919" y="524" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0F1222">ゼロから実装</text>
  </g>

  <!-- 右：Webアプリ -->
  <g>
    <rect x="1130" y="250" width="380" height="340" rx="28" fill="url(#brand)"/>
    <rect x="1188" y="310" width="264" height="168" rx="16" fill="#FFFFFF" fill-opacity="0.18"/>
    <rect x="1220" y="334" width="200" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.55"/>
    <rect x="1220" y="364" width="148" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.38"/>
    <rect x="1220" y="394" width="176" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.38"/>
    <text x="1320" y="530" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#FFFFFF">Webアプリ</text>
    <text x="1320" y="572" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" fill="#FFFFFF" fill-opacity="0.86">内製した業務画面</text>
  </g>

  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" fill="#5A6178" text-anchor="middle">
    <path d="M100 700 H1500" stroke="#0F1222" stroke-opacity="0.08" stroke-width="2"/>
    <circle cx="230" cy="783" r="7" fill="#3B6FE0"/>
    <text x="270" y="795" text-anchor="start">東京側リーダー</text>
    <circle cx="640" cy="783" r="7" fill="#8B4FE0"/>
    <text x="680" y="795" text-anchor="start">ナレッジ共有</text>
    <circle cx="1040" cy="783" r="7" fill="#0EA5C4"/>
    <text x="1080" y="795" text-anchor="start">進捗管理</text>
  </g>
</svg>
