<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="1600" height="1000" role="img" aria-label="建物の写真をナレッジのタワーと照合し、一致すれば答え、確信がなければ答えないという流れの図">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B6FE0"/>
      <stop offset="100%" stop-color="#0EA5C4"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="#F7F8FB"/>

  <!-- 写真 -->
  <rect x="34" y="168" width="168" height="168" rx="20" fill="#FFFFFF" stroke="#DDE2E8" stroke-width="4"/>
  <rect x="54" y="188" width="128" height="92" rx="8" fill="#EEF3FB"/>
  <path d="M70 260 L98 228 L118 248 L136 220 L166 260 Z" fill="#3B6FE0" opacity=".85"/>
  <circle cx="86" cy="212" r="9" fill="#0EA5C4"/>
  <text x="118" y="314" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#2E4E86">写真</text>

  <path d="M218 252 H256" stroke="url(#g)" stroke-width="11" stroke-linecap="round"/>
  <path d="M254 234 L282 252 L254 270 z" fill="#0EA5C4"/>

  <!-- ナレッジ -->
  <rect x="300" y="168" width="190" height="168" rx="20" fill="#EEF3FB" stroke="#C6D6F2" stroke-width="5"/>
  <g fill="#3B6FE0">
    <rect x="336" y="204" width="22" height="88" rx="4"/>
    <rect x="368" y="228" width="18" height="64" rx="4" opacity=".7"/>
    <rect x="396" y="214" width="26" height="78" rx="4"/>
    <rect x="432" y="240" width="16" height="52" rx="4" opacity=".45"/>
  </g>
  <text x="395" y="382" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#2E4E86">タワー図鑑</text>

  <g stroke="#0EA5C4" stroke-width="9" fill="none" stroke-linecap="round">
    <path d="M504 252 H526"/>
    <path d="M526 252 V131"/>
    <path d="M526 252 V373"/>
    <path d="M526 131 H542"/>
    <path d="M526 373 H542"/>
  </g>
  <path d="M540 115 L566 131 L540 147 z" fill="#0EA5C4"/>
  <path d="M540 357 L566 373 L540 389 z" fill="#0EA5C4"/>

  <!-- 一致 -->
  <rect x="558" y="72" width="214" height="118" rx="20" fill="#E9F6F0" stroke="#A9DCC6" stroke-width="5"/>
  <path d="M590 130 L608 148 L638 112" stroke="#1F6B4A" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="710" y="145" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#1F6B4A">一致</text>

  <!-- 見つからない -->
  <rect x="558" y="314" width="214" height="118" rx="20" fill="#FFF4F2" stroke="#E8B49B" stroke-width="5"/>
  <path d="M590 352 L626 388 M626 352 L590 388" stroke="#B44E19" stroke-width="13" stroke-linecap="round"/>
  <text x="710" y="387" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="700" fill="#B44E19">見つからない</text>
</svg>
