<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="分社化による組織改編に合わせて、コラボフローのワークフローを改修したことを表した図">
  <defs>
    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B6FE0"/>
      <stop offset="55%" stop-color="#8B4FE0"/>
      <stop offset="100%" stop-color="#0EA5C4"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7F8FB"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#0F1222" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B4FE0" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#8B4FE0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#fade)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="800" cy="430" rx="520" ry="320" fill="url(#glow)"/>

  <!-- 左：分社化・組織改編 -->
  <g>
    <rect x="90" y="230" width="380" height="380" rx="28" fill="#0F1222"/>
    <rect x="150" y="300" width="120" height="88" rx="16" fill="#3B6FE0"/>
    <rect x="290" y="300" width="120" height="88" rx="16" fill="#8B4FE0"/>
    <rect x="150" y="408" width="260" height="72" rx="16" fill="#FFFFFF" fill-opacity="0.12"/>
    <text x="280" y="530" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#FFFFFF">組織改編</text>
    <text x="280" y="574" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" fill="#8A90A6">分社化に伴う変更</text>
  </g>

  <!-- 中央：コラボフロー -->
  <g>
    <rect x="530" y="230" width="540" height="380" rx="28" fill="#FFFFFF" stroke="#0F1222" stroke-opacity="0.10" stroke-width="2"/>
    <text x="800" y="292" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#5A6178">既存ワークフローの改修</text>

    <rect x="570" y="326" width="460" height="120" rx="22" fill="url(#brand)"/>
    <text x="800" y="400" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="40" font-weight="800" fill="#FFFFFF">コラボフロー</text>

    <rect x="570" y="470" width="214" height="88" rx="22" fill="#0F1222"/>
    <text x="677" y="524" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">設計〜テスト</text>

    <rect x="808" y="470" width="222" height="88" rx="22" fill="#F7F8FB" stroke="#0F1222" stroke-opacity="0.08" stroke-width="2"/>
    <text x="919" y="524" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#0F1222">レビュー対応</text>
  </g>

  <!-- 右：改修後 -->
  <g>
    <rect x="1130" y="250" width="380" height="340" rx="28" fill="url(#brand)"/>
    <circle cx="1248" cy="370" r="28" fill="#FFFFFF" fill-opacity="0.22"/>
    <circle cx="1320" cy="370" r="28" fill="#FFFFFF" fill-opacity="0.22"/>
    <circle cx="1392" cy="370" r="28" fill="#FFFFFF" fill-opacity="0.22"/>
    <path d="M1276 370 H1292" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <path d="M1348 370 H1364" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <text x="1320" y="500" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#FFFFFF">新しい流れ</text>
    <text x="1320" y="544" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" fill="#FFFFFF" fill-opacity="0.86">改編後の組織に適合</text>
  </g>

  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" fill="#5A6178" text-anchor="middle">
    <path d="M100 700 H1500" stroke="#0F1222" stroke-opacity="0.08" stroke-width="2"/>
    <circle cx="210" cy="783" r="7" fill="#3B6FE0"/>
    <text x="250" y="795" text-anchor="start">QA表で認識合わせ</text>
    <circle cx="680" cy="783" r="7" fill="#8B4FE0"/>
    <text x="720" y="795" text-anchor="start">代替リーダー</text>
    <circle cx="1100" cy="783" r="7" fill="#0EA5C4"/>
    <text x="1140" y="795" text-anchor="start">進捗管理</text>
  </g>
</svg>
