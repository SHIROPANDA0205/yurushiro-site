<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="100名を超える大規模なデータ基盤刷新にテストフェーズから参画し、テスト実行から不具合の検出、修正、再テストのサイクルを回したことを表した図">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B6FE0"/>
      <stop offset="100%" stop-color="#0EA5C4"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F7F8FB"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#0F1222" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#3B6FE0"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="url(#paper)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>

  <text x="80" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="800" fill="#0F1222">大規模刷新のテストを回し、見つけた箇所を直す</text>
  <rect x="80" y="128" width="120" height="5" rx="2.5" fill="url(#g1)"/>

  <!-- ============ 左：規模と参画のしかた ============ -->
  <g>
    <text x="80" y="212" font-family="ui-monospace, monospace" font-size="24" font-weight="600" fill="#0EA5C4" letter-spacing="4">SCALE</text>

    <rect x="80" y="248" width="400" height="392" rx="18" fill="#FFFFFF" stroke="#DDE2E8" stroke-width="2"/>

    <text x="112" y="316" font-family="system-ui, sans-serif" font-size="30" fill="#5A6178">プロジェクト全体</text>
    <text x="112" y="382" font-family="system-ui, sans-serif" font-size="58" font-weight="800" fill="#0F1222">100名以上</text>

    <!-- 人数感を点で表す -->
    <g fill="#C6D2E6">
      <circle cx="126" cy="440" r="9"/><circle cx="160" cy="440" r="9"/><circle cx="194" cy="440" r="9"/>
      <circle cx="228" cy="440" r="9"/><circle cx="262" cy="440" r="9"/><circle cx="296" cy="440" r="9"/>
      <circle cx="330" cy="440" r="9"/><circle cx="364" cy="440" r="9"/><circle cx="398" cy="440" r="9"/>
      <circle cx="432" cy="440" r="9"/>
      <circle cx="126" cy="478" r="9"/><circle cx="160" cy="478" r="9"/><circle cx="194" cy="478" r="9"/>
      <circle cx="228" cy="478" r="9"/><circle cx="262" cy="478" r="9"/><circle cx="296" cy="478" r="9"/>
      <circle cx="330" cy="478" r="9"/><circle cx="364" cy="478" r="9"/><circle cx="398" cy="478" r="9"/>
      <circle cx="432" cy="478" r="9"/>
    </g>
    <!-- 自分の位置 -->
    <circle cx="126" cy="516" r="12" fill="#3B6FE0"/>
    <text x="156" y="526" font-family="system-ui, sans-serif" font-size="26" fill="#2E4E86">自分（テストフェーズから参画）</text>

    <rect x="112" y="562" width="336" height="54" rx="10" fill="#FFF4F2" stroke="#E8896B" stroke-width="2"/>
    <text x="140" y="597" font-family="system-ui, sans-serif" font-size="24" fill="#B44E19">経緯は途中から把握していった</text>
  </g>

  <!-- ============ 中央：検証サイクル ============ -->
  <g>
    <text x="560" y="212" font-family="ui-monospace, monospace" font-size="24" font-weight="600" fill="#0EA5C4" letter-spacing="4">CYCLE</text>

    <!-- 4つの工程 -->
    <g>
      <rect x="560" y="272" width="220" height="82" rx="12" fill="#FFFFFF" stroke="#C6D6F2" stroke-width="3"/>
      <text x="670" y="322" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#0F1222">テスト実行</text>

      <rect x="880" y="272" width="220" height="82" rx="12" fill="#FFFFFF" stroke="#C6D6F2" stroke-width="3"/>
      <text x="990" y="322" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#0F1222">不具合の検出</text>

      <rect x="880" y="558" width="220" height="82" rx="12" fill="#EEF3FB" stroke="#3B6FE0" stroke-width="3"/>
      <text x="990" y="608" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#2E4E86">修正</text>

      <rect x="560" y="558" width="220" height="82" rx="12" fill="#FFFFFF" stroke="#C6D6F2" stroke-width="3"/>
      <text x="670" y="608" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#0F1222">再テスト</text>
    </g>

    <!-- 循環の矢印 -->
    <g stroke="#3B6FE0" stroke-width="5" fill="none" marker-end="url(#ar)">
      <path d="M790 313 H868"/>
      <path d="M990 366 V546"/>
      <path d="M870 599 H792"/>
      <path d="M670 546 V366"/>
    </g>

    <text x="830" y="450" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" fill="#8A90A6">繰り返す</text>

    <!-- テストルームの条件 -->
    <rect x="560" y="672" width="540" height="66" rx="12" fill="#F4F7FC" stroke="#DDE2E8" stroke-width="2"/>
    <text x="588" y="713" font-family="system-ui, sans-serif" font-size="26" fill="#5A6178">お客様先のセキュリティルールに従い、所定のテストルームで実施</text>
  </g>

  <!-- ============ 右：修正で触れた範囲 ============ -->
  <g>
    <text x="1180" y="212" font-family="ui-monospace, monospace" font-size="24" font-weight="600" fill="#0EA5C4" letter-spacing="4">FIXED</text>

    <rect x="1180" y="248" width="340" height="392" rx="18" fill="#FFFFFF" stroke="#DDE2E8" stroke-width="2"/>
    <text x="1212" y="308" font-family="system-ui, sans-serif" font-size="26" fill="#5A6178">修正で触れた範囲</text>

    <g>
      <rect x="1212" y="336" width="276" height="70" rx="10" fill="url(#g1)"/>
      <text x="1350" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">DataSpider</text>

      <rect x="1212" y="422" width="276" height="70" rx="10" fill="#F4F7FC" stroke="#DDE2E8" stroke-width="2"/>
      <text x="1350" y="466" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" fill="#0F1222">C#</text>

      <rect x="1212" y="508" width="276" height="70" rx="10" fill="#F4F7FC" stroke="#DDE2E8" stroke-width="2"/>
      <text x="1350" y="552" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" fill="#0F1222">ストアドプロシージャ</text>
    </g>

    <text x="1212" y="612" font-family="system-ui, sans-serif" font-size="22" fill="#8A90A6">※ 前案件で得た知見が効いた箇所</text>
  </g>

  <!-- 下段 -->
  <line x1="80" y1="810" x2="1520" y2="810" stroke="#0F1222" stroke-opacity="0.09" stroke-width="2"/>
  <g font-family="system-ui, sans-serif">
    <text x="80" y="878" font-family="ui-monospace, monospace" font-size="24" fill="#8A90A6">期間</text>
    <text x="80" y="924" font-size="30" font-weight="700" fill="#0F1222">2024.04 – 2024.12</text>

    <text x="480" y="878" font-family="ui-monospace, monospace" font-size="24" fill="#8A90A6">規模</text>
    <text x="480" y="924" font-size="30" font-weight="700" fill="#0F1222">全体100名以上</text>

    <text x="880" y="878" font-family="ui-monospace, monospace" font-size="24" fill="#8A90A6">立場</text>
    <text x="880" y="924" font-size="30" font-weight="700" fill="#0F1222">現場リーダー</text>

    <text x="1240" y="878" font-family="ui-monospace, monospace" font-size="24" fill="#8A90A6">技術</text>
    <text x="1240" y="924" font-size="30" font-weight="700" fill="#0F1222">JP1 / DataSpider</text>
  </g>
</svg>
