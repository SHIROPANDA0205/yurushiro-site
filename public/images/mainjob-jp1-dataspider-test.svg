<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="データ基盤刷新のテストフェーズで、JP1とDataSpiderを用いて検証と改修を行うことを表した図">
  <defs>
    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B6FE0"/>
      <stop offset="55%" stop-color="#8B4FE0"/>
      <stop offset="100%" stop-color="#0EA5C4"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7F8FB"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#0F1222" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0EA5C4" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0EA5C4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#fade)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="800" cy="430" rx="520" ry="320" fill="url(#glow)"/>

  <g>
    <rect x="90" y="210" width="360" height="420" rx="28" fill="#0F1222"/>
    <ellipse cx="270" cy="310" rx="92" ry="28" fill="#3B6FE0"/>
    <rect x="178" y="310" width="184" height="70" fill="#3B6FE0"/>
    <ellipse cx="270" cy="380" rx="92" ry="28" fill="#2A58C4"/>
    <ellipse cx="270" cy="400" rx="92" ry="28" fill="#8B4FE0"/>
    <rect x="178" y="400" width="184" height="70" fill="#8B4FE0"/>
    <ellipse cx="270" cy="470" rx="92" ry="28" fill="#6E3CC0"/>
    <text x="270" y="560" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="36" font-weight="800" fill="#FFFFFF">データ基盤</text>
    <text x="270" y="604" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" fill="#8A90A6">刷新対象</text>
  </g>

  <g>
    <rect x="520" y="230" width="560" height="380" rx="28" fill="#FFFFFF" stroke="#0F1222" stroke-opacity="0.10" stroke-width="2"/>
    <text x="800" y="290" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#5A6178">テストフェーズ</text>

    <rect x="560" y="330" width="220" height="120" rx="22" fill="url(#brand)"/>
    <text x="670" y="402" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="48" font-weight="800" fill="#FFFFFF" letter-spacing="2">JP1</text>

    <rect x="820" y="330" width="220" height="120" rx="22" fill="#0F1222"/>
    <text x="930" y="390" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">テスト実行</text>
    <text x="930" y="426" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#8A90A6">セキュリティ準拠</text>

    <rect x="560" y="480" width="480" height="88" rx="22" fill="#F7F8FB" stroke="#0F1222" stroke-opacity="0.08" stroke-width="2"/>
    <text x="800" y="534" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#0F1222">実行 → 改修 → 再テスト</text>
  </g>

  <g>
    <rect x="1150" y="290" width="360" height="260" rx="64" fill="url(#brand)"/>
    <text x="1330" y="420" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="42" font-weight="800" fill="#FFFFFF">DataSpider</text>
    <text x="1330" y="468" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" fill="#FFFFFF" fill-opacity="0.86">ETL / 改修対応</text>
  </g>

  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="32" fill="#5A6178" text-anchor="middle">
    <path d="M100 700 H1500" stroke="#0F1222" stroke-opacity="0.08" stroke-width="2"/>
    <circle cx="250" cy="783" r="7" fill="#3B6FE0"/>
    <text x="290" y="795" text-anchor="start">セキュリティ準拠</text>
    <circle cx="680" cy="783" r="7" fill="#8B4FE0"/>
    <text x="720" y="795" text-anchor="start">修正対応</text>
    <circle cx="1060" cy="783" r="7" fill="#0EA5C4"/>
    <text x="1100" y="795" text-anchor="start">ベンダー間連携</text>
  </g>
</svg>
